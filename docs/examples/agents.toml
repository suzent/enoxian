# Example daemon-local agent config for enoxian.
#
# Copy to ~/.enoxian/agents.toml to enable it. This file is NEVER synced across
# the circle — it only controls how THIS device reacts to chat @mentions. A
# remote member can mention an agent, but only your local config decides whether
# (and how) to run it. See docs/concepts/proposals.md for the file-history model.

# How this device reacts to @mentions:
#   "pull"  (default) — do nothing automatically; an agent is expected to read
#                       chat and act on its own. Safe: no mention runs anything.
#   "push"            — when a mention names an agent below, launch it.
reaction = "push"

# How long an agent stays "in conversation" with whoever it replied to, so a
# follow-up needs no mention. Set 0 to require an explicit mention every time.
engagement_window_secs = 180

# Agents that read every human message rather than waiting to be addressed.
# OFF by default: this sends every line in the Circle to that agent's model
# provider, which the whole Circle can see (the roster marks ambient agents).
ambient = []

# How far a chain of agent-to-agent hand-offs may run before it stops, counted
# from the human message that started it. Hard limit 50.
max_relay_turns = 20

# Any of the four settings above can be overridden for a single Circle. What a
# Circle does not name, it inherits. Device-local like the rest of this file —
# a remote member cannot decide what this machine spends.
# [circles."8f3b1c2a-...."]
# ambient = ["claude"]
# max_relay_turns = 4

# ── Claude Code over ACP ──────────────────────────────────────────────────────
# enoxian speaks ACP to a transport bridge that drives the real Claude Code CLI.
# First install the official `claude` CLI, run `claude auth login`, then run
# `enox agent install claude`. System Node.js 22+ with npm is an adapter
# prerequisite. Enoxian pins the bridge locally and passes the resolved CLI
# through CLAUDE_CODE_EXECUTABLE so Claude's subscription, settings, MCP
# servers, and project skills remain authoritative.
#
# Mention "@claude fix the typos in README.md" in the circle chat and, under the
# push policy above, the daemon runs this agent in the workspace. Whatever files
# it writes are captured by the ambient proposal engine as a managed-process
# proposal — review with `enox proposal list`.
[agents.claude]
driver = "acp"
command = ["<enoxian-home>/adapters/claude-agent-acp/0.69.0/node_modules/.bin/claude-agent-acp"]

# ── Codex over ACP ────────────────────────────────────────────────────────────
# enoxian speaks ACP to the Codex adapter (same mechanism as claude above).
# Requires Node/npx AND OpenAI auth: either `codex login` (ChatGPT) or a
# CODEX_API_KEY / OPENAI_API_KEY env var visible to the daemon. Without auth it
# fails at the prompt turn.
[agents.codex]
driver = "acp"
command = ["npx", "@agentclientprotocol/codex-acp"]
# Let another agent delegate to this one: if @claude's reply mentions @codex,
# codex runs. Off by default — the device that spends the tokens decides. The
# cascade is bounded: at most one mention per agent reply is honoured, an agent
# never wakes itself, and the whole cascade is capped at max_relay_turns agent
# turns, counted from the human message that started it.
# Another agent may hand work to this one — that needs no switch here. An agent
# listed in this file, on a device set to "push", is reachable by the other
# agents in the Circle; `max_relay_turns` above bounds how far a chain runs.

# ── Suzent over ACP (a built-in "native" plugin) ───────────────────────────────
# Suzent speaks ACP itself, so there is no adapter bridge, no Node.js, and
# nothing to pin: `enox agent install suzent` only writes this handle, and the
# command stays by-name so reinstalling the CLI elsewhere cannot strand it.
# Suzent is a translator over a running backend, so `suzent serve` (or
# `suzent start`) must be up — the session then appears in Suzent's own UI with
# its memory and skills, and the circle workspace is bound as that session's
# working directory.
[agents.suzent]
driver = "acp"
command = ["suzent", "acp"]

# ── A plain argv agent (fallback driver) ──────────────────────────────────────
# The "argv" driver is the universal fallback for any tool that does NOT speak
# ACP: enoxian spawns the command with {{task}} substituted and captures
# whatever it writes to disk as a proposal. No streaming reply, no memory — the
# agent needs to know nothing about enoxian. Uncomment and point at a real
# command to use it.
#
# [agents.mytool]
# driver = "argv"
# command = ["mytool", "--prompt", "{{task}}"]
# working_dir = "src"   # optional, relative to the workspace root
