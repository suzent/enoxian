#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - ufw
  - unattended-upgrades

users:
  - name: enoxian
    system: true
    shell: /usr/sbin/nologin
    create_home: true

runcmd:
  - dpkg-reconfigure -f noninteractive unattended-upgrades || true
  - ufw allow OpenSSH
  - ufw allow 36521/tcp
  - ufw allow 36521/udp
  - ufw --force enable
