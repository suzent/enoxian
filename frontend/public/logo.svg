<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shape { fill: #000000; }
    /* 自动适应系统的深色/浅色模式 */
    @media (prefers-color-scheme: dark) {
      .shape { fill: #FFFFFF; }
    }
  </style>
  <defs>
    <mask id="cutout">
      <!-- 白色部分为保留区域，黑色部分为掏空区域 -->
      <rect width="512" height="512" fill="white"/>
      <!-- 镂空圆环：比原版大，但比刚才的“胖版”小 -->
      <circle cx="256" cy="288" r="52" fill="black"/>
    </mask>
  </defs>
  
  <g mask="url(#cutout)">
    <!-- 巨石碑 (Obelisk) 左侧：
         恢复了更修长的比例，但中间缝隙保留了 52px 的宽度（原版是 24px），
         以确保在 favicon 上不至于糊成一团。 -->
    <polygon class="shape" points="230,32 230,480 100,480 154,160"/>
    <!-- 巨石碑 (Obelisk) 右侧 -->
    <polygon class="shape" points="282,32 282,480 412,480 358,160"/>
  </g>
  
  <!-- 中心圆点：比原版大，比刚才小，正好能作为一个清晰的像素点 -->
  <circle class="shape" cx="256" cy="288" r="24"/>
</svg>