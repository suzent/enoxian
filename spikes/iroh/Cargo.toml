[package]
name = "iroh-spike"
publish = false
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.3", features = ["test-utils"] }
libp2p-identity = { version = "=0.2.13", features = ["ed25519", "peerid"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
