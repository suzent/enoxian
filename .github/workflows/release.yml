name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: enoxian-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: enoxian-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: enoxian-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: enoxian-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: enoxian-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install Zig + cargo-zigbuild (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build (aarch64 linux via zigbuild)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --bins --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/enox dist/
          cp target/${{ matrix.target }}/release/enoxd dist/
          tar -C dist -czf ${{ matrix.asset }} enox enoxd

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/enox.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/enoxd.exe" dist/
          Compress-Archive -Path dist/enox.exe, dist/enoxd.exe -DestinationPath ${{ matrix.asset }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
          generate_release_notes: true
