name: Release
#
# Triggered by a `v*` tag. `tag-release.yml` pushes that tag automatically when
# a `chore/release-vX.Y.Z` pull request merges, and dispatches this workflow.
#
# The pipeline never exposes an unverified release to installer users: assets
# are uploaded to a draft, the draft is published as a *prerelease* (so
# `/releases/latest/download`, which both installers use by default, still
# resolves to the previous good release), the published installers are then
# exercised end to end, and only after that does `promote` mark the release
# latest. A failed smoke test leaves a prerelease behind rather than a broken
# `latest`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: version
        name: Validate tag, version, changelog, and main ancestry
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $TAG" >&2
            exit 1
          }

          version="${TAG#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$cargo_version" || {
            echo "tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }

          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "$TAG")"
          checked_out_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$checked_out_commit" || {
            echo "checked-out commit $checked_out_commit is not tag $TAG ($tag_commit)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "tag $TAG is not reachable from origin/main" >&2
            exit 1
          }

          # Any suffix on the version means a prerelease: it is published, but
          # never marked latest, so `curl | sh` users are not moved onto it.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
            echo "::notice::$TAG is a prerelease; it will not be marked latest."
          fi

          # Fail here rather than after five platform builds have run.
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          }
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md | grep -q '[^[:space:]]' || {
            echo "CHANGELOG section for $version is empty" >&2
            exit 1
          }

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Rust release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend release gate
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev
          npm run build

      - name: Installer syntax gate
        shell: pwsh
        run: |
          sh -n scripts/install.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  audit:
    name: Audit release dependencies
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      # `.cargo/audit.toml` is the single source of truth for accepted
      # advisories; see the matching step in ci.yml.
      - id: advisories
        name: Read accepted advisories
        run: |
          set -euo pipefail
          ignore="$(sed -nE 's/^[[:space:]]*"(RUSTSEC-[0-9]{4}-[0-9]{4})".*/\1/p' \
            .cargo/audit.toml | paste -sd, -)"
          echo "Accepted advisories: ${ignore:-<none>}"
          echo "ignore=$ignore" >> "$GITHUB_OUTPUT"

      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main: Node 24 (#48)
        with:
          token: ${{ github.token }}
          ignore: ${{ steps.advisories.outputs.ignore }}

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, audit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Required by actions/attest-build-provenance to sign the artifact.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: enoxian-linux-x86_64.tar.gz
            smoke: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: enoxian-linux-aarch64.tar.gz
            smoke: false
          # macos-latest runners are arm64, so this is a native build and can
          # run the full daemon smoke test — it is also the artifact most Mac
          # users install.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: enoxian-macos-aarch64.tar.gz
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: enoxian-macos-x86_64.tar.gz
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: enoxian-windows-x86_64.zip
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Restore the cache before installing cargo-zigbuild so that the built
      # binary lands in the cached ~/.cargo/bin instead of being recompiled
      # from source on every release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-bin: true

      - name: Install Zig and cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked

      - name: Build Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --bins --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Smoke test native Unix binary
        if: runner.os != 'Windows' && matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          "$bin/enox" --version | grep -F "${{ needs.verify.outputs.version }}"
          "$bin/enox" daemon run --help >/dev/null
          "$bin/enox" bootstrap serve --help >/dev/null
          "$bin/enox" service --help >/dev/null

          export ENOXIAN_HOME="$RUNNER_TEMP/enoxian-home"
          export ENOXIAN_DEVICE_LABEL="release-smoke"
          port=37651
          "$bin/enox" daemon run --port "$port" \
            >"$RUNNER_TEMP/enoxian-ui.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$port/app" \
              -o "$RUNNER_TEMP/enoxian-index.html" && break
            sleep 0.25
          done
          grep -F 'id="root"' "$RUNNER_TEMP/enoxian-index.html"
          asset="$(grep -oE '/assets/[^"]+\.js' "$RUNNER_TEMP/enoxian-index.html" | head -1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:$port$asset" >/dev/null
          ENOXIAN_API="http://127.0.0.1:$port" "$bin/enox" stop
          for _ in $(seq 1 40); do
            kill -0 "$daemon_pid" 2>/dev/null || break
            sleep 0.25
          done
          ! kill -0 "$daemon_pid" 2>/dev/null || {
            echo "daemon did not exit after enox stop" >&2
            exit 1
          }
          wait "$daemon_pid"
          trap - EXIT

      - name: Smoke test Windows binary
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          (& "$bin/enox.exe" --version) | Select-String -SimpleMatch "${{ needs.verify.outputs.version }}"
          & "$bin/enox.exe" daemon run --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/enox.exe" bootstrap serve --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/enox.exe" service --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $previousHome = $env:ENOXIAN_HOME
          $previousLabel = $env:ENOXIAN_DEVICE_LABEL
          $previousApi = $env:ENOXIAN_API
          $env:ENOXIAN_HOME = Join-Path $env:RUNNER_TEMP 'enoxian-home'
          $env:ENOXIAN_DEVICE_LABEL = 'release-smoke'
          $port = 37651
          $env:ENOXIAN_API = "http://127.0.0.1:$port"
          $stdout = Join-Path $env:RUNNER_TEMP 'enoxian-ui.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'enoxian-ui.err.log'
          $daemon = Start-Process -FilePath "$bin/enox.exe" -ArgumentList @('daemon', 'run', '--port', $port) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/app"
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $response -or $response.StatusCode -ne 200) {
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'embedded WebUI did not become available'
            }
            if ($response.Content -notmatch 'id="root"') {
              throw 'embedded WebUI entry point is invalid'
            }
            $asset = [regex]::Match($response.Content, '/assets/[^"]+\.js').Value
            if (-not $asset) { throw 'embedded WebUI has no JavaScript asset' }
            $assetResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port$asset"
            if ($assetResponse.StatusCode -ne 200) {
              throw 'embedded WebUI JavaScript asset is unavailable'
            }
            & "$bin/enox.exe" stop
            if ($LASTEXITCODE -ne 0) { throw 'enox stop failed' }
            if (-not $daemon.WaitForExit(10000)) {
              throw 'daemon did not exit after enox stop'
            }
            if ($daemon.ExitCode -ne 0) {
              throw "daemon exited with status $($daemon.ExitCode)"
            }
          } finally {
            if ($daemon -and -not $daemon.HasExited) {
              Stop-Process -Id $daemon.Id -Force
            }
            $env:ENOXIAN_HOME = $previousHome
            $env:ENOXIAN_DEVICE_LABEL = $previousLabel
            $env:ENOXIAN_API = $previousApi
          }

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/enox" dist/
          tar -C dist -czf "${{ matrix.asset }}" enox

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/enox.exe" dist/
          Compress-Archive -Path dist/enox.exe -DestinationPath "${{ matrix.asset }}"

      # Signed, transparency-logged provenance for the exact archive that is
      # published. Users verify with:
      #   gh attestation verify enoxian-<platform>.tar.gz --repo suzent/enoxian
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release assets
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            enoxian-linux-x86_64.tar.gz
            enoxian-linux-aarch64.tar.gz
            enoxian-macos-aarch64.tar.gz
            enoxian-macos-x86_64.tar.gz
            enoxian-windows-x86_64.zip
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || { echo "missing asset: $asset" >&2; exit 1; }
          done
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          cp scripts/install.sh scripts/install.ps1 dist/
          for asset in SHA256SUMS install.sh install.ps1; do
            test -s "dist/$asset" || { echo "missing release support asset: $asset" >&2; exit 1; }
          done

      # Curated CHANGELOG section first, then the auto-generated commit/PR list,
      # then install instructions. CHANGELOG.md documents this layout.
      - name: Compose release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > curated.md
          test -s curated.md || {
            echo "CHANGELOG section for $VERSION is empty" >&2
            exit 1
          }

          generated="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)"

          # Written line by line rather than as a heredoc: a heredoc body would
          # have to sit inside this YAML block scalar's indentation, and those
          # leading spaces would turn the markdown into code blocks.
          {
            cat curated.md
            printf '\n---\n\n'
            printf '%s\n' "$generated"
            printf '%s\n' \
              '' \
              '---' \
              '' \
              '## Install' \
              '' \
              '```sh' \
              "curl --proto '=https' --tlsv1.2 -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh" \
              '```' \
              '' \
              '```powershell' \
              "irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex" \
              '```' \
              '' \
              'Both installers verify the downloaded archive against SHA256SUMS' \
              'before installing. Every archive also carries signed build provenance:' \
              '' \
              '```sh' \
              "gh attestation verify enoxian-macos-aarch64.tar.gz --repo $GITHUB_REPOSITORY" \
              '```'
          } > release-notes.md

      # Assets are uploaded to a draft so a partial upload never becomes
      # visible. The release then goes live as a prerelease: published, but not
      # `latest`, so installer users stay on the previous release until the
      # published installers have been exercised by install-smoke.
      - name: Create draft, upload all assets, then publish as prerelease
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [ "$draft" != "true" ] && [ "$prerelease" != "true" ]; then
              echo "release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: [verify, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # `--version $TAG` resolves to /releases/download/$TAG/, which works for a
      # prerelease. Nothing here touches /releases/latest/download, which is
      # exactly what users would hit.
      - name: Exercise published installer on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/enoxian-bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" --version "$TAG" --bin-dir "$bin_dir"
          "$bin_dir/enox" --version | grep -F "$VERSION"
          "$bin_dir/enox" service status
          test ! -e "$bin_dir/enoxd"

          export ENOXIAN_HOME="$RUNNER_TEMP/enoxian-update-home"
          export ENOXIAN_DEVICE_LABEL="installer-update-smoke"
          export ENOXIAN_API="http://127.0.0.1:37652"
          "$bin_dir/enox" daemon run --port 37652 \
            >"$RUNNER_TEMP/enoxian-update.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:37652/app" >/dev/null && break
            sleep 0.25
          done
          curl -fsS "http://127.0.0.1:37652/app" >/dev/null
          sh "$RUNNER_TEMP/install.sh" --version "$TAG" --bin-dir "$bin_dir"
          ! kill -0 "$daemon_pid" 2>/dev/null || {
            echo "installer left the previous daemon running" >&2
            exit 1
          }
          "$bin_dir/enox" --version | grep -F "$VERSION"
          trap - EXIT

      - name: Verify published provenance on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) asset=enoxian-linux-x86_64.tar.gz ;;
            macOS) asset=enoxian-macos-aarch64.tar.gz ;;
          esac
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" \
            -o "$RUNNER_TEMP/$asset"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo "$GITHUB_REPOSITORY"

      - name: Exercise published installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP 'enoxian-bin'
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1" -OutFile $installer
          & $installer -Version $env:TAG -BinDir $binDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (& (Join-Path $binDir 'enox.exe') --version) |
            Select-String -SimpleMatch $env:VERSION
          & (Join-Path $binDir 'enox.exe') service status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $binDir 'enoxd.exe')) {
            throw 'legacy enoxd.exe should not be installed'
          }

          $env:ENOXIAN_HOME = Join-Path $env:RUNNER_TEMP 'enoxian-update-home'
          $env:ENOXIAN_DEVICE_LABEL = 'installer-update-smoke'
          $env:ENOXIAN_API = 'http://127.0.0.1:37652'
          $stdout = Join-Path $env:RUNNER_TEMP 'enoxian-update.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'enoxian-update.err.log'
          $daemon = Start-Process -FilePath (Join-Path $binDir 'enox.exe') `
            -ArgumentList @('daemon', 'run', '--port', 37652) -PassThru `
            -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:37652/app'
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'daemon did not start for installer update smoke test' }
            & $installer -Version $env:TAG -BinDir $binDir -NoPathUpdate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not $daemon.WaitForExit(10000)) {
              throw 'installer left the previous daemon running'
            }
            (& (Join-Path $binDir 'enox.exe') --version) |
              Select-String -SimpleMatch $env:VERSION
          } finally {
            if ($daemon -and -not $daemon.HasExited) {
              Stop-Process -Id $daemon.Id -Force
            }
          }

  promote:
    name: Promote to latest
    needs: [verify, publish, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark the release latest
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG is a prerelease; leaving it published but not latest."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Update Homebrew tap
    needs: [verify, promote]
    if: ${{ vars.ENOXIAN_HOMEBREW_TAP != '' && needs.verify.outputs.prerelease == 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source formula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          path: source

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ENOXIAN_HOMEBREW_TAP }}
          token: ${{ secrets.ENOXIAN_HOMEBREW_TOKEN }}
          path: tap

      - name: Update and validate formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula assets
          cp source/Formula/enoxian.rb tap/Formula/enoxian.rb
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'enoxian-*.tar.gz' --dir assets

          sed -i '' -E "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" tap/Formula/enoxian.rb

          for asset in assets/*.tar.gz; do
            name="$(basename "$asset")"
            sha="$(shasum -a 256 "$asset" | awk '{print $1}')"
            awk -v needle="$name" -v sha="$sha" '
              index(previous, needle) > 0 && /sha256/ {
                sub(/"[0-9a-f]{64}"/, "\"" sha "\"")
              }
              { print; previous=$0 }
            ' tap/Formula/enoxian.rb > tap/Formula/enoxian.rb.tmp
            mv tap/Formula/enoxian.rb.tmp tap/Formula/enoxian.rb
          done

          cd tap
          brew audit --strict Formula/enoxian.rb
          brew install --formula ./Formula/enoxian.rb
          brew test enoxian

      - name: Commit tap update
        working-directory: tap
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enoxian.rb
          git diff --cached --quiet && exit 0
          git commit -m "enoxian $TAG"
          git push
