name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: version
        name: Validate tag, version, changelog, and main ancestry
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $TAG" >&2
            exit 1
          }

          version="${TAG#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$cargo_version" || {
            echo "tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }

          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "$TAG")"
          checked_out_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$checked_out_commit" || {
            echo "checked-out commit $checked_out_commit is not tag $TAG ($tag_commit)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "tag $TAG is not reachable from origin/main" >&2
            exit 1
          }

          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Rust release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend release gate
        working-directory: frontend
        run: |
          npm ci
          npm audit
          npm run build

      - name: Installer syntax gate
        shell: pwsh
        run: |
          sh -n scripts/install.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  audit:
    name: Audit release dependencies
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          ignore: RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0124,RUSTSEC-2026-0207,RUSTSEC-2026-0208,RUSTSEC-2026-0209,RUSTSEC-2026-0211,RUSTSEC-2026-0212

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: enoxian-linux-x86_64.tar.gz
            smoke: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: enoxian-linux-aarch64.tar.gz
            smoke: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: enoxian-macos-aarch64.tar.gz
            smoke: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: enoxian-macos-x86_64.tar.gz
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: enoxian-windows-x86_64.zip
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig and cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --bins --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Smoke test native Unix binaries
        if: runner.os != 'Windows' && matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          "$bin/enox" --version | grep -F "${{ needs.verify.outputs.version }}"
          "$bin/enoxd" --version | grep -F "${{ needs.verify.outputs.version }}"

      - name: Smoke test Windows binaries
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          (& "$bin/enox.exe" --version) | Select-String -SimpleMatch "${{ needs.verify.outputs.version }}"
          (& "$bin/enoxd.exe" --version) | Select-String -SimpleMatch "${{ needs.verify.outputs.version }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/enox" dist/
          cp "target/${{ matrix.target }}/release/enoxd" dist/
          tar -C dist -czf "${{ matrix.asset }}" enox enoxd

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/enox.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/enoxd.exe" dist/
          Compress-Archive -Path dist/enox.exe,dist/enoxd.exe -DestinationPath "${{ matrix.asset }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            enoxian-linux-x86_64.tar.gz
            enoxian-linux-aarch64.tar.gz
            enoxian-macos-aarch64.tar.gz
            enoxian-macos-x86_64.tar.gz
            enoxian-windows-x86_64.zip
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || { echo "missing asset: $asset" >&2; exit 1; }
          done
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          cp scripts/install.sh scripts/install.ps1 dist/
          for asset in SHA256SUMS install.sh install.ps1; do
            test -s "dist/$asset" || { echo "missing release support asset: $asset" >&2; exit 1; }
          done

      - name: Compose curated release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "CHANGELOG section for $VERSION is empty" >&2
            exit 1
          }

      - name: Create draft, upload all assets, then publish
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$draft" = "true" || {
              echo "release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  homebrew:
    name: Update Homebrew tap
    needs: [verify, publish]
    if: ${{ vars.ENOXIAN_HOMEBREW_TAP != '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout source formula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          path: source

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ENOXIAN_HOMEBREW_TAP }}
          token: ${{ secrets.ENOXIAN_HOMEBREW_TOKEN }}
          path: tap

      - name: Update and validate formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula assets
          cp source/Formula/enoxian.rb tap/Formula/enoxian.rb
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'enoxian-*.tar.gz' --dir assets

          sed -i '' -E "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" tap/Formula/enoxian.rb

          for asset in assets/*.tar.gz; do
            name="$(basename "$asset")"
            sha="$(shasum -a 256 "$asset" | awk '{print $1}')"
            awk -v needle="$name" -v sha="$sha" '
              index(previous, needle) > 0 && /sha256/ {
                sub(/"[0-9a-f]{64}"/, "\"" sha "\"")
              }
              { print; previous=$0 }
            ' tap/Formula/enoxian.rb > tap/Formula/enoxian.rb.tmp
            mv tap/Formula/enoxian.rb.tmp tap/Formula/enoxian.rb
          done

          cd tap
          brew audit --strict Formula/enoxian.rb
          brew install --formula ./Formula/enoxian.rb
          brew test enoxian

      - name: Commit tap update
        working-directory: tap
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enoxian.rb
          git diff --cached --quiet && exit 0
          git commit -m "enoxian $TAG"
          git push
