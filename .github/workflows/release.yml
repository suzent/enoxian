name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: version
        name: Validate tag, version, changelog, and main ancestry
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $TAG" >&2
            exit 1
          }

          version="${TAG#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$cargo_version" || {
            echo "tag $TAG does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }

          git fetch origin main --tags
          tag_commit="$(git rev-list -n 1 "$TAG")"
          checked_out_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$checked_out_commit" || {
            echo "checked-out commit $checked_out_commit is not tag $TAG ($tag_commit)" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "tag $TAG is not reachable from origin/main" >&2
            exit 1
          }

          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Rust release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend release gate
        working-directory: frontend
        run: |
          npm ci
          npm audit
          npm run build

      - name: Installer syntax gate
        shell: pwsh
        run: |
          sh -n scripts/install.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  audit:
    name: Audit release dependencies
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          ignore: RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0124,RUSTSEC-2026-0207,RUSTSEC-2026-0208,RUSTSEC-2026-0209,RUSTSEC-2026-0211,RUSTSEC-2026-0212

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: enoxian-linux-x86_64.tar.gz
            smoke: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: enoxian-linux-aarch64.tar.gz
            smoke: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: enoxian-macos-aarch64.tar.gz
            smoke: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: enoxian-macos-x86_64.tar.gz
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: enoxian-windows-x86_64.zip
            smoke: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig and cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --bins --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Smoke test native Unix binary
        if: runner.os != 'Windows' && matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          "$bin/enox" --version | grep -F "${{ needs.verify.outputs.version }}"
          "$bin/enox" daemon run --help >/dev/null
          "$bin/enox" bootstrap serve --help >/dev/null
          "$bin/enox" service --help >/dev/null

          export ENOXIAN_HOME="$RUNNER_TEMP/enoxian-home"
          export ENOXIAN_DEVICE_LABEL="release-smoke"
          port=37651
          "$bin/enox" daemon run --port "$port" \
            >"$RUNNER_TEMP/enoxian-ui.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:$port/app" \
              -o "$RUNNER_TEMP/enoxian-index.html" && break
            sleep 0.25
          done
          grep -F 'id="root"' "$RUNNER_TEMP/enoxian-index.html"
          asset="$(grep -oE '/assets/[^"]+\.js' "$RUNNER_TEMP/enoxian-index.html" | head -1)"
          test -n "$asset"
          curl -fsS "http://127.0.0.1:$port$asset" >/dev/null
          kill "$daemon_pid"
          wait "$daemon_pid" || true
          trap - EXIT

      - name: Smoke test Windows binary
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          (& "$bin/enox.exe" --version) | Select-String -SimpleMatch "${{ needs.verify.outputs.version }}"
          & "$bin/enox.exe" daemon run --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/enox.exe" bootstrap serve --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$bin/enox.exe" service --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $previousHome = $env:ENOXIAN_HOME
          $previousLabel = $env:ENOXIAN_DEVICE_LABEL
          $env:ENOXIAN_HOME = Join-Path $env:RUNNER_TEMP 'enoxian-home'
          $env:ENOXIAN_DEVICE_LABEL = 'release-smoke'
          $port = 37651
          $stdout = Join-Path $env:RUNNER_TEMP 'enoxian-ui.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'enoxian-ui.err.log'
          $daemon = Start-Process -FilePath "$bin/enox.exe" -ArgumentList @('daemon', 'run', '--port', $port) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/app"
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $response -or $response.StatusCode -ne 200) {
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'embedded WebUI did not become available'
            }
            if ($response.Content -notmatch 'id="root"') {
              throw 'embedded WebUI entry point is invalid'
            }
            $asset = [regex]::Match($response.Content, '/assets/[^"]+\.js').Value
            if (-not $asset) { throw 'embedded WebUI has no JavaScript asset' }
            $assetResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port$asset"
            if ($assetResponse.StatusCode -ne 200) {
              throw 'embedded WebUI JavaScript asset is unavailable'
            }
          } finally {
            if ($daemon -and -not $daemon.HasExited) {
              Stop-Process -Id $daemon.Id -Force
            }
            $env:ENOXIAN_HOME = $previousHome
            $env:ENOXIAN_DEVICE_LABEL = $previousLabel
          }

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/enox" dist/
          tar -C dist -czf "${{ matrix.asset }}" enox

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/enox.exe" dist/
          Compress-Archive -Path dist/enox.exe -DestinationPath "${{ matrix.asset }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            enoxian-linux-x86_64.tar.gz
            enoxian-linux-aarch64.tar.gz
            enoxian-macos-aarch64.tar.gz
            enoxian-macos-x86_64.tar.gz
            enoxian-windows-x86_64.zip
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || { echo "missing asset: $asset" >&2; exit 1; }
          done
          (cd dist && sha256sum "${expected[@]}" > SHA256SUMS)
          cp scripts/install.sh scripts/install.ps1 dist/
          for asset in SHA256SUMS install.sh install.ps1; do
            test -s "dist/$asset" || { echo "missing release support asset: $asset" >&2; exit 1; }
          done

      - name: Compose curated release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "CHANGELOG section for $VERSION is empty" >&2
            exit 1
          }

      - name: Create draft, upload all assets, then publish
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$draft" = "true" || {
              echo "release $TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: [verify, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Exercise published installer on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/enoxian-bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" --version "$TAG" --bin-dir "$bin_dir"
          "$bin_dir/enox" --version | grep -F "$VERSION"
          "$bin_dir/enox" service status
          test ! -e "$bin_dir/enoxd"

      - name: Exercise published installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP 'enoxian-bin'
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1" -OutFile $installer
          & $installer -Version $env:TAG -BinDir $binDir -NoPathUpdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (& (Join-Path $binDir 'enox.exe') --version) |
            Select-String -SimpleMatch $env:VERSION
          & (Join-Path $binDir 'enox.exe') service status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $binDir 'enoxd.exe')) {
            throw 'legacy enoxd.exe should not be installed'
          }

  homebrew:
    name: Update Homebrew tap
    needs: [verify, publish]
    if: ${{ vars.ENOXIAN_HOMEBREW_TAP != '' }}
    runs-on: macos-latest
    steps:
      - name: Checkout source formula
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          path: source

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ENOXIAN_HOMEBREW_TAP }}
          token: ${{ secrets.ENOXIAN_HOMEBREW_TOKEN }}
          path: tap

      - name: Update and validate formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula assets
          cp source/Formula/enoxian.rb tap/Formula/enoxian.rb
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'enoxian-*.tar.gz' --dir assets

          sed -i '' -E "s/^  version \"[^\"]*\"/  version \"$VERSION\"/" tap/Formula/enoxian.rb

          for asset in assets/*.tar.gz; do
            name="$(basename "$asset")"
            sha="$(shasum -a 256 "$asset" | awk '{print $1}')"
            awk -v needle="$name" -v sha="$sha" '
              index(previous, needle) > 0 && /sha256/ {
                sub(/"[0-9a-f]{64}"/, "\"" sha "\"")
              }
              { print; previous=$0 }
            ' tap/Formula/enoxian.rb > tap/Formula/enoxian.rb.tmp
            mv tap/Formula/enoxian.rb.tmp tap/Formula/enoxian.rb
          done

          cd tap
          brew audit --strict Formula/enoxian.rb
          brew install --formula ./Formula/enoxian.rb
          brew test enoxian

      - name: Commit tap update
        working-directory: tap
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enoxian.rb
          git diff --cached --quiet && exit 0
          git commit -m "enoxian $TAG"
          git push
