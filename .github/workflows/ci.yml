name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # Advisories are published against code that has not changed, and pull
  # requests now only audit when they touch dependencies. A weekly run keeps a
  # new advisory against an untouched lockfile from going unnoticed when main
  # is quiet; `changes` turns everything else off for it.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.94.0"
  NODE_VERSION: "22"

jobs:
  # Decides which jobs a pull request needs. Every job below is a required
  # status check, so nothing is filtered with workflow-level `paths:` — a
  # required check that never reports blocks the merge. A job skipped through
  # `if:` reports as passing instead. Pushes to main and merge-queue runs build
  # everything, which is what keeps the caches warm and catches rot.
  #
  # Dependent jobs fail open: if this job itself fails, they would otherwise be
  # skipped — and a skipped required check passes. So each one also runs
  # whenever `needs.changes.result` is anything but success.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      installers: ${{ steps.filter.outputs.installers }}
      audit: ${{ steps.filter.outputs.audit }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          areas=(workflows rust frontend installers audit docker)

          set_all() {
            for area in "${areas[@]}"; do
              echo "$area=$1" >> "$GITHUB_OUTPUT"
            done
          }

          case "$EVENT" in
            pull_request) ;;
            schedule)
              set_all false
              echo "audit=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              set_all true
              exit 0
              ;;
          esac

          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base FETCH_HEAD HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"

          # A change to this workflow can alter any job, so it runs them all.
          if grep -qx '.github/workflows/ci.yml' <<< "$changed"; then
            set_all true
            exit 0
          fi

          matches() {
            if grep -qE "$2" <<< "$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          matches workflows  '^\.github/'
          # The end-to-end scripts run in the test job against the built CLI.
          matches rust       '^(src/|tests/|Cargo\.(toml|lock)$|build\.rs$|\.cargo/|rustfmt\.toml$|scripts/test-[^/]+\.sh$)'
          matches frontend   '^frontend/'
          # `.gitattributes` decides the scripts' line endings, which the
          # installers job guards against CRLF.
          matches installers '^(scripts/|\.gitattributes$)'
          matches audit      '^(Cargo\.(toml|lock)$|\.cargo/)'
          matches docker     '^(Dockerfile$|\.dockerignore$|Cargo\.(toml|lock)$|build\.rs$|src/)'

  workflows:
    name: Workflow lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by digest, like every action in this repository.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  changelog:
    name: Changelog entry
    # Only a pull request has a diff to check; elsewhere this is a no-op.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CONTRIBUTING.md requires user-visible changes to land under
      # `## [Unreleased]`. Release notes are cut from that section, so a missed
      # entry silently ships an undocumented change. Apply the `no-changelog`
      # label for internal-only work (refactors, tests, CI).
      #
      # The label is read from the API rather than `github.event.pull_request`,
      # because the payload is a snapshot of the event that started the run:
      # a label applied after a failure is absent from it, and re-running the
      # job replays that same stale payload. Reading it live makes the
      # documented escape hatch work without an empty commit to raise a fresh
      # event — and keeps label changes off the workflow triggers, so applying
      # one cannot cancel and restart the whole matrix.
      - name: Require a CHANGELOG entry
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
               --jq '.[].name' | grep -qx 'no-changelog'; then
            echo "Exempt: 'no-changelog' label applied."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base FETCH_HEAD HEAD)"
          if git diff --name-only "$base" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This pull request changes no CHANGELOG entry. Add one under '## [Unreleased]', or apply the 'no-changelog' label if users cannot observe the change, then re-run this check."
          exit 1

  dependency-audit:
    name: Dependency security audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `.cargo/audit.toml` is the single source of truth for accepted
      # advisories; each entry there carries the reason it is accepted. Reading
      # the list here keeps the workflow from drifting out of sync with it.
      - id: advisories
        name: Read accepted advisories
        run: |
          set -euo pipefail
          ignore="$(sed -nE 's/^[[:space:]]*"(RUSTSEC-[0-9]{4}-[0-9]{4})".*/\1/p' \
            .cargo/audit.toml | paste -sd, -)"
          echo "Accepted advisories: ${ignore:-<none>}"
          echo "ignore=$ignore" >> "$GITHUB_OUTPUT"

      # Installed and run directly rather than through `rustsec/audit-check`.
      # That action builds cargo-audit without `--locked`, so it resolves
      # cargo-audit's dependencies fresh every run — and a broken publish
      # anywhere in that tree fails the job with no relation to this
      # repository's dependencies. That is exactly what happened with
      # jiff 0.2.36, whose tarball omits the `include_str!` files its source
      # references, breaking every PR at once. `--locked` uses the lockfile
      # cargo-audit published and tested against, so the tool's own tree stops
      # drifting under us.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: Audit Rust dependencies
        run: |
          set -euo pipefail
          ignore="${{ steps.advisories.outputs.ignore }}"
          args=()
          # `--ignore` takes one advisory each; an empty list must not expand
          # to a bare flag.
          if [ -n "$ignore" ]; then
            IFS=',' read -ra ids <<< "$ignore"
            for id in "${ids[@]}"; do
              args+=(--ignore "$id")
            done
          fi
          cargo audit "${args[@]}"

  installers:
    name: Installer syntax
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.installers == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate POSIX shell installer
        run: sh -n scripts/install.sh

      - name: Validate relay setup and updater
        run: |
          bash -n scripts/rendezvous/setup-rendezvous.sh
          bash -n scripts/rendezvous/setup-relay-updates.sh
          bash -n scripts/rendezvous/deploy-rendezvous.sh
          python3 scripts/rendezvous/test-update-relay.py

      # install.ps1 had no validation of any kind, which is how an unavailable
      # .NET API reached users and stopped the installer before it downloaded
      # anything. Parsing is the floor — it would not have caught that bug,
      # which was a runtime property lookup — so the guard below covers the
      # actual failure mode.
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path scripts/install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
          }
          Write-Host 'install.ps1 parses'

      # `RuntimeInformation` needs .NET Framework 4.7.1. Older Windows 10
      # installs lack it, and under Set-StrictMode the missing property is a
      # hard error rather than a fallback, so the installer refused to run on
      # machines it supports. Architecture detection must stay on the
      # environment variables, which every supported Windows has.
      - name: Installer architecture detection stays portable
        run: |
          set -euo pipefail
          # Match code only: `[^#]*` cannot cross a `#`, so the comment above
          # the fix explaining why the API is banned does not trip its own guard.
          if grep -nE '^[^#]*RuntimeInformation' scripts/install.ps1; then
            echo "::error::install.ps1 must not use RuntimeInformation (needs .NET Framework 4.7.1, absent on older Windows 10)."
            exit 1
          fi
          echo "architecture detection uses portable environment variables"

      # `.gitattributes` forces LF on shell scripts; a CRLF install.sh fails at
      # the shebang on the user's machine, long after CI passed.
      - name: Reject CRLF in shell scripts
        run: |
          set -euo pipefail
          if grep -rlU $'\r' --include='*.sh' scripts/; then
            echo "::error::Shell scripts must use LF line endings."
            exit 1
          fi

  quality:
    name: Rust quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The embedded Iroh relay is only built into Linux releases and the
      # bootstrap image; keep it compiling, lint-clean and its tests passing.
      - name: Clippy (Iroh relay server)
        run: cargo clippy --locked --all-targets --features iroh-relay-server -- -D warnings

      - name: Iroh relay server tests
        run: cargo test --locked --lib --features iroh-relay-server iroh_relay_server

      # `--all-targets` excludes doctests, so they need their own invocation.
      - name: Doctests
        run: cargo test --locked --doc

  test:
    name: Rust tests (${{ matrix.os }})
    needs: changes
    # Gated per step, not with a job-level `if:`. A matrix job skipped before
    # it expands reports a single check named with the literal matrix
    # expression, so the three required `Rust tests (<os>)` checks would never
    # report and the pull request could not merge. Gating the steps still
    # starts each runner, but only for a few seconds.
    if: ${{ !cancelled() }}
    env:
      RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: No Rust changes
        if: env.RUN != 'true'
        run: echo "No Rust inputs changed; skipping the tests."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - name: Install Rust
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.RUN == 'true'
        with:
          key: ${{ matrix.os }}

      - name: Test
        if: env.RUN == 'true'
        run: cargo test --locked --all-targets

      # End-to-end membership against a real daemon. Single daemon, no peer,
      # no timing — the checks assert what the member list says afterwards
      # rather than what the command printed, which is the only way a CLI that
      # reports success on a rejected request gets caught.
      - name: Circle membership (end to end)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: ./scripts/test-members.sh

      # Two real daemons on one machine over Iroh: invite, join, admission,
      # presence, file sync both ways, and recovery after a restart. They meet
      # over loopback, so no relay is needed.
      - name: Two-device sync (end to end)
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: ./scripts/test-sync.sh

  frontend:
    name: Frontend production build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      # Runtime dependencies are embedded into the shipped binary, so a prod
      # advisory blocks the build. Dev-only advisories are reported but do not
      # gate a release the way an unfiltered `npm audit` did.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit development dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit

      # Runs before the build: a failing unit test should be reported as a
      # failing test, not buried behind a build that may also fail for its own
      # reasons.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Bootstrap image
    needs: changes
    # A full release build is expensive, so a pull request only rebuilds when
    # something that feeds the image changed. Every push to main rebuilds
    # unconditionally, which is what keeps the image from rotting unnoticed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag enoxian-bootstrap:ci .

      - name: Verify entrypoint
        run: |
          set -euo pipefail
          docker run --rm --entrypoint enox enoxian-bootstrap:ci --version
          docker run --rm --entrypoint enox enoxian-bootstrap:ci bootstrap serve --help
