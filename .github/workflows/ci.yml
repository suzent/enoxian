name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.88.0"
  NODE_VERSION: "22"

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by digest, like every action in this repository.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CONTRIBUTING.md requires user-visible changes to land under
      # `## [Unreleased]`. Release notes are cut from that section, so a missed
      # entry silently ships an undocumented change. Apply the `no-changelog`
      # label for internal-only work (refactors, tests, CI).
      - name: Require a CHANGELOG entry
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base FETCH_HEAD HEAD)"
          if git diff --name-only "$base" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This pull request changes no CHANGELOG entry. Add one under '## [Unreleased]', or apply the 'no-changelog' label if users cannot observe the change."
          exit 1

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `.cargo/audit.toml` is the single source of truth for accepted
      # advisories; each entry there carries the reason it is accepted. Reading
      # the list here keeps the workflow from drifting out of sync with it.
      - id: advisories
        name: Read accepted advisories
        run: |
          set -euo pipefail
          ignore="$(sed -nE 's/^[[:space:]]*"(RUSTSEC-[0-9]{4}-[0-9]{4})".*/\1/p' \
            .cargo/audit.toml | paste -sd, -)"
          echo "Accepted advisories: ${ignore:-<none>}"
          echo "ignore=$ignore" >> "$GITHUB_OUTPUT"

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main: Node 24 (#48)
        with:
          token: ${{ github.token }}
          ignore: ${{ steps.advisories.outputs.ignore }}

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate POSIX shell installer
        run: sh -n scripts/install.sh

      # install.ps1 had no validation of any kind, which is how an unavailable
      # .NET API reached users and stopped the installer before it downloaded
      # anything. Parsing is the floor — it would not have caught that bug,
      # which was a runtime property lookup — so the guard below covers the
      # actual failure mode.
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path scripts/install.ps1).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
          }
          Write-Host 'install.ps1 parses'

      # `RuntimeInformation` needs .NET Framework 4.7.1. Older Windows 10
      # installs lack it, and under Set-StrictMode the missing property is a
      # hard error rather than a fallback, so the installer refused to run on
      # machines it supports. Architecture detection must stay on the
      # environment variables, which every supported Windows has.
      - name: Installer architecture detection stays portable
        run: |
          set -euo pipefail
          if grep -n 'RuntimeInformation' scripts/install.ps1; then
            echo "::error::install.ps1 must not use RuntimeInformation (needs .NET Framework 4.7.1, absent on older Windows 10)."
            exit 1
          fi
          echo "architecture detection uses portable environment variables"

      # `.gitattributes` forces LF on shell scripts; a CRLF install.sh fails at
      # the shebang on the user's machine, long after CI passed.
      - name: Reject CRLF in shell scripts
        run: |
          set -euo pipefail
          if grep -rlU $'\r' --include='*.sh' scripts/; then
            echo "::error::Shell scripts must use LF line endings."
            exit 1
          fi

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # `--all-targets` excludes doctests, so they need their own invocation.
      - name: Doctests
        run: cargo test --locked --doc

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-16
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --locked --all-targets

      # End-to-end membership against a real daemon. Single daemon, no peer,
      # no timing — the checks assert what the member list says afterwards
      # rather than what the command printed, which is the only way a CLI that
      # reports success on a rejected request gets caught.
      - name: Circle membership (end to end)
        if: runner.os == 'Linux'
        run: ./scripts/test-members.sh

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      # Runtime dependencies are embedded into the shipped binary, so a prod
      # advisory blocks the build. Dev-only advisories are reported but do not
      # gate a release the way an unfiltered `npm audit` did.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit development dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit

      # Runs before the build: a failing unit test should be reported as a
      # failing test, not buried behind a build that may also fail for its own
      # reasons.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Bootstrap image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A full release build is expensive, so only rebuild when something that
      # feeds the image changed. Every push to main rebuilds unconditionally,
      # which is what keeps the image from rotting unnoticed.
      - id: changes
        name: Decide whether to build
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base="$(git merge-base FETCH_HEAD HEAD)"
          if git diff --name-only "$base" HEAD \
            | grep -qE '^(Dockerfile|Cargo\.(toml|lock)|build\.rs|src/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image inputs changed; skipping the build."
          fi

      - name: Build image
        if: steps.changes.outputs.build == 'true'
        run: docker build --tag enoxian-bootstrap:ci .

      - name: Verify entrypoint
        if: steps.changes.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint enox enoxian-bootstrap:ci --version
          docker run --rm --entrypoint enox enoxian-bootstrap:ci bootstrap serve --help
