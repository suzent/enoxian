name: Tag release
#
# Step 2 of 2 in the release flow. When a `chore/release-vX.Y.Z` pull request
# merges, this tags the merge commit and starts the release pipeline.
#
# The tag is pushed with GITHUB_TOKEN, and GitHub deliberately does not fire
# workflows for pushes made with that token — so this job dispatches
# `release.yml` explicitly rather than relying on the tag push trigger.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and start the release
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'chore/release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Required to dispatch release.yml.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - id: version
        name: Derive and cross-check the version
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          branch_version="${HEAD_REF#chore/release-v}"
          test "$version" = "$branch_version" || {
            echo "branch $HEAD_REF does not match Cargo.toml version $version" >&2
            exit 1
          }
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists; nothing to do" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "enoxian $TAG" "$MERGE_SHA"
          git push origin "$TAG"

      - name: Start the release pipeline
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field tag="$TAG"
          {
            echo "### Tagged $TAG"
            echo
            echo "Release pipeline dispatched:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
          } >> "$GITHUB_STEP_SUMMARY"
