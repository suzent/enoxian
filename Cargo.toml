[package]
name = "enoxian"
version = "0.1.4"
edition = "2021"
rust-version = "1.83.0"

[[bin]]
name = "enoxd"
path = "src/bin/enoxd.rs"

[[bin]]
name = "enox"
path = "src/bin/enox.rs"

[lib]
name = "enoxian"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }

# P2P
libp2p = { version = "0.56", features = [
    "tcp", "websocket", "dns", "quic", "noise", "yamux",
    "ed25519", "mdns", "kad", "identify", "ping",
    "rendezvous", "relay", "dcutr", "pnet", "macros", "tokio",
] }
tokio-util = { version = "0.7", features = ["compat"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# IDs / crypto
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hkdf = "0.12"
bip39 = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
dirs = "5"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"

# Phase 1 — CRDT + HTTP/WS server
yrs = "0.26"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Phase 1 — File watcher
notify = "8"

# Phase 2 — enox HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
libp2p-stream = "0.4.0-alpha"
open = "5"

# M11 — MLS group key management (RFC 9420)
openmls = "0.8"
openmls_basic_credential = { version = "0.5", features = ["clonable"] }
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
tls_codec = "0.4"

[dev-dependencies]
tempfile = "3"
